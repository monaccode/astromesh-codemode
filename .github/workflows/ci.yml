name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} pytest -q
  adapters:
    # Framework adapters, the level-2 cost eval (mocked litellm) and the doc snippets that
    # need a framework: every extra installed
    # (the core matrix skips these tests).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --all-extras --python 3.12
      - run: uv run --locked --all-extras --python 3.12 pytest -q tests/adapters tests/test_cost_l2.py tests/test_docs_examples.py
  traps:
    # The sandbox's security proof: malicious programs with the default Limits().
    # Exits 1 (red build) if a single trap gets through. See docs/eval.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.12
      - run: uv run --python 3.12 python -m astromesh_codemode.eval traps
  cost-l1:
    # Cost eval, level 1: scripted model, real tools, tiktoken o200k_base. Deterministic;
    # fails if it errors or if its directional/answer checks break. See docs/eval.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.12
      - run: uv run --python 3.12 python -m astromesh_codemode.eval cost --level 1 --out ${{ runner.temp }}/results
