[project]
name = "astromesh-codemode"
version = "0.1.0"
description = "Code Mode for AI agents: wrap your tools behind search/run and execute model-written code in a Monty sandbox."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Juan Carlos Romero", email = "jc@fulfaro.dev" }]
keywords = ["code-mode","agents","llm","mcp","sandbox","monty","tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["pydantic-monty>=1.7,<1.8", "jsonschema>=4.20"]

[project.optional-dependencies]
mcp = ["mcp>=1.28,<2", "pyyaml>=6"]
otel = ["opentelemetry-api>=1.27"]
eval = []
langchain = ["langchain-core>=1.6"]
crewai = ["crewai>=1.15"]
adk = ["google-adk>=1.14"]
openai-agents = ["openai-agents>=0.20"]
pydantic-ai = ["pydantic-ai-slim>=2.55"]
llamaindex = ["llama-index-core>=0.14"]
smolagents = ["smolagents>=1.26"]
agent-framework = ["agent-framework>=1.19"]
all = [
  "mcp>=1.28,<2",
  "pyyaml>=6",
  "opentelemetry-api>=1.27",
  "langchain-core>=1.6",
  "crewai>=1.15",
  "google-adk>=1.14",
  "openai-agents>=0.20",
  "pydantic-ai-slim>=2.55",
  "llama-index-core>=0.14",
  "smolagents>=1.26",
  "agent-framework>=1.19",
]

[project.scripts]
astromesh-codemode = "astromesh_codemode.cli:main"

[project.urls]
Homepage = "https://github.com/monaccode/astromesh-codemode"
Issues = "https://github.com/monaccode/astromesh-codemode/issues"

[dependency-groups]
dev = [
  "pytest>=8",
  "mcp>=1.28,<2",
  "pyyaml>=6",
  "pytest-asyncio>=0.24",
  "ruff>=0.16",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["astromesh_codemode", "tests", "README*.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]
exclude = ["uv.lock", ".superpowers", ".github"]

[tool.hatch.build.targets.wheel]
packages = ["astromesh_codemode"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "W", "I", "UP", "B", "C4", "SIM", "RET", "PERF", "PIE", "DTZ", "LOG", "G", "PT", "N", "PTH", "RUF", "BLE", "PLE", "PLW"]
